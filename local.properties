## Plantilla de entorno local (local.properties.example)
## 
## INSTRUCCIONES:
## 1. Copia este archivo y renómbralo a 'local.properties' (sin la terminación .example)
## 2. Actualiza la variable 'sdk.dir' con la ruta absoluta donde tienes instalado el Android SDK en tu máquina.
## 3. NUNCA subas 'local.properties' al control de versiones (ya está ignorado en .gitignore).
##
## Ejemplos de rutas comunes:
## Windows: sdk.dir=C\:\\Users\\TU_USUARIO\\AppData\\Local\\Android\\Sdk
## macOS:   sdk.dir=/Users/TU_USUARIO/Library/Android/sdk
## Linux:   sdk.dir=/home/TU_USUARIO/Android/Sdk

sdk.dir=C\:\\Users\\chamu\\AppData\\Local\\Android\\Sdk
